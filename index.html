<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>หมู่บ้านเศรษฐกิจ REPOST</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <div class="brand-small">หมู่บ้านเศรษฐกิจ</div>
      <h1>REPOST</h1>
      <p>ภาพเก่า เล่าใหม่ ความทรงจำของชุมชน</p>
    </div>
  </header>

  <main class="app">
    <section class="toolbar">
      <input id="searchInput" type="text" placeholder="ค้นหาโพสต์ เรื่องเล่า หรือสถานที่..." />

      <select id="categoryFilter">
        <option value="all">ทุกหมวดหมู่</option>
      </select>
    </section>

    <section id="postFeed" class="feed">
      <div class="loading">กำลังโหลดเรื่องเล่า...</div>
    </section>
  </main>

  <footer class="footer">
    หมู่บ้านเศรษฐกิจ REPOST | Public History Project
  </footer>

  <script src="script.js"></script>
</body>
</html>
